[project]
name = "beacon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "redis>=6.4.0",
]

[project.scripts]
ingest = "beacon.data.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
